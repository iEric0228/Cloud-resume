name: Deploy

# Persistent deployment: pushes to main apply infrastructure and publish the
# site (no auto-destroy). Pull requests run validation only.
# The ephemeral deploy -> test -> destroy flow lives in ephemeral-test.yml.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'infrastructure/**'
      - 'tests/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.9.0
  TF_STATE_BUCKET: ericchiu-terraform-state
  TF_STATE_KEY_DEV: cloud-resume/dev/terraform.tfstate
  TF_LOCK_TABLE: terraform-state-lock

jobs:
  # ── Validation (PRs) ──────────────────────────────────────────────────────
  validate:
    name: Validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt + validate
        run: |
          terraform fmt -check -recursive infrastructure
          cd infrastructure/environments/dev
          terraform init -backend=false -input=false
          terraform validate

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lambda unit tests
        run: |
          pip install -r tests/requirements-dev.txt
          python -m pytest tests/ -q

      - name: Python lint (advisory)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check backend scripts

      - name: JS lint (advisory)
        continue-on-error: true
        run: |
          npm install --no-save eslint @eslint/js globals
          npx eslint .

  # ── Persistent deploy (main / manual) ─────────────────────────────────────
  deploy:
    name: Deploy
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::125156866057:role/github-OICD
          role-session-name: cloud-resume-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform apply
        working-directory: ./infrastructure/environments/dev
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY_DEV }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}" \
            -input=false

          terraform plan -input=false -out=tfplan
          terraform apply -input=false -auto-approve tfplan

          # Export outputs for the publish step.
          {
            echo "S3_BUCKET=$(terraform output -raw s3_bucket_name)"
            echo "API_URL=$(terraform output -raw api_url)"
            echo "CLOUDFRONT_ID=$(terraform output -raw cloudfront_distribution_id)"
            echo "WEBSITE_URL=$(terraform output -raw website_url)"
          } >> "$GITHUB_ENV"

      - name: Publish frontend
        run: bash scripts/publish-frontend.sh

      - name: Smoke test
        run: |
          echo "Waiting for propagation..."
          sleep 20
          if curl -fsS "$WEBSITE_URL" > /dev/null; then
            echo "Website reachable: $WEBSITE_URL"
          else
            echo "::warning::Website smoke test failed for $WEBSITE_URL"
          fi
          response=$(curl -fsS "$API_URL" || echo '{"error":"request_failed"}')
          echo "API response: $response"
          echo "$response" | grep -q "visitor_count" \
            && echo "Visitor counter API OK" \
            || echo "::warning::Unexpected API response"

      - name: Summary
        run: |
          {
            echo "## Cloud Resume — Deployed"
            echo ""
            echo "- **Website:** $WEBSITE_URL"
            echo "- **API:** $API_URL"
          } >> "$GITHUB_STEP_SUMMARY"
