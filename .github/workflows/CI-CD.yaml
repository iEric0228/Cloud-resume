name: '☁️ Cloud Resume CI/CD'

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Deployment Action'
        required: true
        default: 'deploy-test-destroy'
        type: choice
        options:
          - 'deploy-test-destroy'
          - 'deploy-test-keep'  
          - 'destroy-only'
      keep_alive_minutes:
        description: 'Keep alive time (minutes) for testing'
        required: false
        default: '5'
        type: string

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.6.0

jobs:
  # Validation job (runs on PRs)
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: 🚀 Checkout Code
      uses: actions/checkout@v4

    - name: ⚡ Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: 🔍 Validate Everything
      run: |
        # Terraform validation
        cd infrastructure/environments/dev
        terraform init
        terraform validate
        terraform fmt -check
        echo "✅ Terraform validation passed"
        
        # Website validation
        cd ../../../
        required_files=("frontend/index.html" "frontend/styles/styles.css" "frontend/utils/visitor-counter.js")
        for file in "${required_files[@]}"; do
          [[ -f "$file" ]] && echo "✅ $file" || { echo "❌ Missing $file"; exit 1; }
        done
        echo "✅ Website files validation passed"

  # Main deploy job (runs on manual dispatch)
  deploy-resume:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - name: 🚀 Checkout Code
      uses: actions/checkout@v4

    - name: ⚡ Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
        terraform_wrapper: false

    - name: 🔐 Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::125156866057:role/github-OICD
        role-session-name: cloud-resume-${{ github.run_id }}
        aws-region: ${{ env.AWS_REGION }}

    - name: 🏗️ Deploy Infrastructure
      if: github.event.inputs.action != 'destroy-only'
      working-directory: ./infrastructure/environments/dev
      run: |
        echo "🚀 Deploying cloud resume infrastructure..."
        terraform init
        
        echo "🔍 Checking for existing resources..."
        
        # ✅ ENHANCED: More robust import with state checking
        echo "👥 Checking IAM role..."
        if terraform state show module.lambda.aws_iam_role.lambda_role 2>/dev/null; then
          echo "✅ IAM role already in Terraform state"
        elif aws iam get-role --role-name cloud-resume-lambda-role-dev 2>/dev/null; then
          echo "📋 IAM role exists in AWS, importing to Terraform state..."
          terraform import module.lambda.aws_iam_role.lambda_role cloud-resume-lambda-role-dev || {
            echo "⚠️ IAM role import failed, will try to recreate"
            # Delete the existing role to allow recreation
            echo "🗑️ Removing existing IAM role to allow recreation..."
            aws iam list-attached-role-policies --role-name cloud-resume-lambda-role-dev --query "AttachedPolicies[].PolicyArn" --output text | tr '\t' '\n' | \
            xargs -r -I {} aws iam detach-role-policy --role-name cloud-resume-lambda-role-dev --policy-arn {}
            
            aws iam list-role-policies --role-name cloud-resume-lambda-role-dev --query "PolicyNames" --output text | tr '\t' '\n' | \
            xargs -r -I {} aws iam delete-role-policy --role-name cloud-resume-lambda-role-dev --policy-name {}
            
            aws iam delete-role --role-name cloud-resume-lambda-role-dev
            echo "✅ Existing IAM role cleaned up"
          }
        else
          echo "👥 IAM role doesn't exist, will create new one"
        fi
        
        echo "📋 Checking IAM role policy..."
        if terraform state show module.lambda.aws_iam_role_policy.lambda_policy 2>/dev/null; then
          echo "✅ IAM role policy already in Terraform state"
        elif aws iam get-role-policy --role-name cloud-resume-lambda-role-dev --policy-name cloud-resume-lambda-policy-dev 2>/dev/null; then
          echo "📋 IAM role policy exists, importing to Terraform state..."
          terraform import module.lambda.aws_iam_role_policy.lambda_policy cloud-resume-lambda-role-dev:cloud-resume-lambda-policy-dev || {
            echo "⚠️ IAM role policy import failed or already in state"
          }
        else
          echo "📋 IAM role policy doesn't exist, will create new one"
        fi
        
        # Check and import DynamoDB table
        echo "📊 Checking DynamoDB table..."
        if terraform state show module.dynamodb.aws_dynamodb_table.visitor_count 2>/dev/null; then
          echo "✅ DynamoDB table already in Terraform state"
        elif aws dynamodb describe-table --table-name cloud-resume-visitor-count-dev 2>/dev/null; then
          echo "📋 DynamoDB table exists, importing to Terraform state..."
          terraform import module.dynamodb.aws_dynamodb_table.visitor_count cloud-resume-visitor-count-dev || {
            echo "⚠️ Table import failed or already in state"
          }
        else
          echo "📋 DynamoDB table doesn't exist, will create new one"
        fi
        
        # Plan and apply
        echo "📋 Planning deployment..."
        terraform plan
        terraform apply -auto-approve
        
        echo "🔍 Debug: Available Terraform outputs:"
        terraform output || echo "❌ No outputs available"
        
        # Export outputs with better error handling
        S3_BUCKET=$(terraform output -raw s3_bucket_name 2>/dev/null || echo "")
        WEBSITE_URL=$(terraform output -raw website_url 2>/dev/null || echo "")  
        API_URL=$(terraform output -raw api_url 2>/dev/null || echo "")
        
        echo "🔍 Debug: Extracted values:"
        echo "S3_BUCKET='$S3_BUCKET'"
        echo "WEBSITE_URL='$WEBSITE_URL'"
        echo "API_URL='$API_URL'"
        
        # Validate required outputs
        if [ -z "$S3_BUCKET" ]; then
          echo "❌ ERROR: S3 bucket name is empty!"
          echo "🔍 All available outputs:"
          terraform output -json || echo "No JSON outputs available"
          exit 1
        fi
        
        if [ -z "$WEBSITE_URL" ]; then
          echo "❌ ERROR: Website URL is empty!"
          exit 1
        fi
        
        if [ -z "$API_URL" ]; then
          echo "❌ ERROR: API URL is empty!"
          exit 1
        fi
        
        # Export to environment
        echo "S3_BUCKET=$S3_BUCKET" >> $GITHUB_ENV
        echo "WEBSITE_URL=$WEBSITE_URL" >> $GITHUB_ENV
        echo "API_URL=$API_URL" >> $GITHUB_ENV
        
        echo "✅ All required outputs extracted successfully"

    - name: 📤 Deploy Website
      if: github.event.inputs.action != 'destroy-only'
      run: |
        echo "📤 Deploying website files..."
        
        # Get outputs from Terraform with proper error handling
        cd infrastructure/environments/dev
        
        # Extract outputs with proper quoting
        S3_BUCKET=$(terraform output -raw s3_bucket_name 2>/dev/null || echo "")
        API_URL=$(terraform output -raw api_url 2>/dev/null || echo "")
        WEBSITE_URL=$(terraform output -raw website_url 2>/dev/null || echo "")
        
        # Validate outputs exist
        if [[ -z "$S3_BUCKET" || -z "$API_URL" || -z "$WEBSITE_URL" ]]; then
          echo "❌ ERROR: Missing required Terraform outputs"
          echo "S3_BUCKET: '$S3_BUCKET'"
          echo "API_URL: '$API_URL'"
          echo "WEBSITE_URL: '$WEBSITE_URL'"
          exit 1
        fi
        
        echo "🔍 Using S3 bucket: $S3_BUCKET"
        echo "🔍 Using API URL: $API_URL"
        echo "🔍 Using Website URL: $WEBSITE_URL"
        
        # Go back to project root
        cd ../../../
        
        # Verify website directory exists
        if [[ ! -d "website" ]]; then
          echo "❌ ERROR: website directory not found"
          ls -la
          exit 1
        fi
        
        echo "✅ Found website directory"
        ls -la frontend/
        
        # Update visitor counter with API URL
        echo "🔄 Updating visitor counter with API URL..."
        echo "🔍 API_URL variable contains: '$API_URL'"
        
        if [[ -f "frontend/utils/visitor-counter.js" ]]; then
          # Verify API_URL is not empty
          if [[ -z "$API_URL" ]]; then
            echo "❌ ERROR: API_URL is empty!"
            exit 1
          fi
          
          # Show original content
          echo "📄 Original visitor-counter.js content (first 10 lines):"
          head -10 frontend/utils/visitor-counter.js
          
          # Create backup
          cp frontend/utils/visitor-counter.js frontend/utils/visitor-counter.js.bak
          echo "✅ Created backup: frontend/utils/visitor-counter.js.bak"
          
          # ✅ ENHANCED: More precise replacement - only replace the assignment line
          echo "🔄 Performing URL replacement..."
          sed "s|REPLACE_WITH_API_URL|${API_URL}|g" frontend/utils/visitor-counter.js.bak > frontend/utils/visitor-counter.js
          
          echo "✅ sed command executed successfully"
          
          # Verify replacement worked
          if grep -q "REPLACE_WITH_API_URL" frontend/utils/visitor-counter.js; then
            echo "⚠️ WARNING: Some REPLACE_WITH_API_URL placeholders still exist"
            echo "🔍 Lines containing REPLACE_WITH_API_URL:"
            grep -n "REPLACE_WITH_API_URL" frontend/utils/visitor-counter.js || true
            
            # Check if assignment was replaced correctly
            if grep -q "'${API_URL}'" frontend/utils/visitor-counter.js; then
              echo "✅ Assignment replacement successful (some placeholders remain for logic)"
            else
              echo "❌ Assignment replacement failed!"
              exit 1
            fi
          else
            echo "✅ All placeholders replaced"
          fi
          
          # Show modified content
          echo "📄 Modified visitor-counter.js content (first 10 lines):"
          head -10 frontend/utils/visitor-counter.js
          
        else
          echo "❌ ERROR: visitor-counter.js not found"
          echo "🔍 Current directory contents:"
          ls -la
          echo "🔍 Website directory contents:"
          ls -la frontend/ || echo "frontend/ directory not found"
          exit 1
        fi
        
        # Verify all required files exist
        required_files=(
          "frontend/index.html"
          "frontend/styles/styles.css" 
          "frontend/utils/visitor-counter.js"
        )
        
        for file in "${required_files[@]}"; do
          if [[ ! -f "$file" ]]; then
            echo "❌ ERROR: Required file $file not found!"
            exit 1
          else
            echo "✅ Found: $file"
          fi
        done
        
        # Upload website files to S3
        echo "🚀 Uploading website files to S3..."
        
        # Sync all files first
        aws s3 sync frontend/ "s3://${S3_BUCKET}/" --delete
        
        # Set specific content types and cache headers
        echo "🔧 Setting content types and cache headers..."
        
        aws s3 cp frontend/index.html "s3://${S3_BUCKET}/index.html" \
          --content-type "text/html" \
          --cache-control "no-cache, no-store, must-revalidate"
          
        aws s3 cp frontend/styles/styles.css "s3://${S3_BUCKET}/css/styles.css" \
          --content-type "text/css" \
          --cache-control "max-age=31536000"
          
        # ✅ FIX: Upload the MODIFIED visitor-counter.js (with real API URL)
        aws s3 cp frontend/utils/visitor-counter.js "s3://${S3_BUCKET}/js/visitor-counter.js" \
          --content-type "application/javascript" \
          --cache-control "max-age=300"
        
        # Upload animation.js if it exists
        if [[ -f "frontend/utils/animation.js" ]]; then
          aws s3 cp frontend/utils/animation.js "s3://${S3_BUCKET}/js/animation.js" \
            --content-type "application/javascript" \
            --cache-control "max-age=31536000"
          echo "✅ Uploaded animation.js"
        fi
        
        echo "✅ Website files uploaded to S3 successfully!"
        
        # ✅ ADD: Invalidate CloudFront cache for JavaScript files
        echo "🔄 Invalidating CloudFront cache..."
        cd infrastructure/environments/dev
        CLOUDFRONT_ID=$(terraform output -raw cloudfront_distribution_id 2>/dev/null || echo "")
        cd ../../../
        
        if [ ! -z "$CLOUDFRONT_ID" ]; then
          echo "☁️ Invalidating CloudFront distribution: $CLOUDFRONT_ID"
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_ID" \
            --paths "/js/visitor-counter.js" "/js/*" "/*" \
            --query 'Invalidation.Id' \
            --output text
          echo "✅ CloudFront cache invalidated"
        else
          echo "⚠️ CloudFront distribution ID not found, skipping cache invalidation"
        fi
        
        # ✅ FIX: NOW restore original visitor-counter.js (AFTER uploading AND invalidating)
        if [[ -f "frontend/utils/visitor-counter.js.bak" ]]; then
          mv frontend/utils/visitor-counter.js.bak frontend/utils/visitor-counter.js
          echo "✅ Restored original visitor-counter.js for git cleanliness"
        fi
        
        echo "✅ Website deployment completed successfully!"
        echo "🌐 Website available at: $WEBSITE_URL"
        
        # Test the deployment
        echo "🧪 Testing API endpoint..."
        HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL" || echo "000")
        if [[ "$HTTP_STATUS" == "200" ]]; then
          echo "✅ API endpoint is responding correctly"
        else
          echo "⚠️ API endpoint returned status: $HTTP_STATUS"
        fi
        
        echo "🎉 Deployment completed! Visit your resume at: $WEBSITE_URL"

    - name: 🐛 Debug Lambda Function
      if: github.event.inputs.action != 'destroy-only'
      run: |
        echo "🔍 Debugging Lambda function..."
        
        # Get Lambda function name and details
        cd infrastructure/environments/dev
        LAMBDA_NAME=$(terraform output -raw lambda_function_name 2>/dev/null || echo "")
        cd ../../../
        
        if [ ! -z "$LAMBDA_NAME" ]; then
          echo "📋 Lambda function: $LAMBDA_NAME"
          
          # Check Lambda configuration
          echo "🔍 Lambda configuration:"
          aws lambda get-function-configuration --function-name "$LAMBDA_NAME"
          
          # Test the Lambda function directly
          echo "🧪 Testing Lambda function directly..."
          aws lambda invoke \
            --function-name "$LAMBDA_NAME" \
            --payload '{}' \
            --output json \
            lambda_response.json
            
          echo "📄 Lambda direct response:"
          cat lambda_response.json
          
          # Check recent logs
          echo "📊 Recent CloudWatch logs (last 5 minutes):"
          LOG_GROUP="/aws/lambda/$LAMBDA_NAME"
          aws logs describe-log-groups --log-group-name-prefix "$LOG_GROUP" --query 'logGroups[0].logGroupName' --output text | \
          xargs -I {} aws logs filter-log-events --log-group-name {} --start-time $(date -d '5 minutes ago' +%s)000 --query 'events[].message' --output text || echo "No recent logs found"
        else
          echo "❌ Could not find Lambda function name"
        fi

    - name: 🧪 Test Deployment
      if: github.event.inputs.action != 'destroy-only'
      run: |
        echo "🧪 Testing deployed resume..."
        sleep 30  # Reduced wait time
        
        # Test website
        echo "Testing website..."
        if curl -f -s "$WEBSITE_URL" > /dev/null; then
          echo "✅ Website is accessible"
        else
          echo "⚠️ Website test failed"
        fi
        
        # Test API endpoint
        echo "Testing API endpoint: $API_URL"
        response=$(curl -s "$API_URL" 2>/dev/null || echo '{"error":"request_failed"}')
        echo "🔍 API Response: $response"
        
        # Check if API returns expected format
        if echo "$response" | grep -q "visitor_count"; then
          echo "✅ Visitor counter API is working correctly"
          visitor_count=$(echo "$response" | grep -o '"visitor_count":[0-9]*' | cut -d':' -f2)
          echo "📊 Current visitor count: $visitor_count"
        else
          echo "⚠️ API test: Unexpected response format"
          echo "Expected: {\"visitor_count\": number}"
          echo "Got: $response"
        fi

    - name: 📊 Summary
      if: github.event.inputs.action != 'destroy-only'
      run: |
        echo "## ☁️ Cloud Resume Deployment" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**🌐 Live Website:** [$WEBSITE_URL]($WEBSITE_URL)" >> $GITHUB_STEP_SUMMARY
        echo "**⚡ Visitor Counter API:** [$API_URL]($API_URL)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # ✅ FIX: Use correct input parameter name
        keep_minutes="${{ github.event.inputs.keep_alive_minutes || '5' }}"
        if [ "${{ github.event.inputs.action }}" = "deploy-test-destroy" ]; then
          echo "⏰ **Auto-cleanup scheduled in $keep_minutes minute(s)**" >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ **Status:** Deployed and running" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔗 Quick Links" >> $GITHUB_STEP_SUMMARY
        echo "- **Website**: [Visit Resume]($WEBSITE_URL)" >> $GITHUB_STEP_SUMMARY
        echo "- **API Test**: [Test Visitor Counter]($API_URL)" >> $GITHUB_STEP_SUMMARY

    - name: ⏳ Keep Running (Demo Period)
      if: github.event.inputs.action == 'deploy-test-keep' || github.event.inputs.action == 'deploy-test-destroy'
      run: |
        # ✅ FIX: Use minutes instead of hours to match input parameter
        minutes="${{ github.event.inputs.keep_alive_minutes || '1' }}"
        echo "⏳ Keeping resume live for $minutes minute(s) for demo/testing..."
        echo "🌐 Visit: $WEBSITE_URL"
        sleep $(($minutes * 60))  # Convert minutes to seconds

    - name: 🗑️ Cleanup
      if: always() && (github.event.inputs.action == 'deploy-test-destroy' || github.event.inputs.action == 'destroy-only')
      working-directory: ./infrastructure/environments/dev
      run: |
        echo "🗑️ Cleaning up resources..."
        
        # Get bucket name if we need to
        if [ "${{ github.event.inputs.action }}" = "destroy-only" ]; then
          S3_BUCKET=$(terraform output -raw s3_bucket_name 2>/dev/null || echo "")
        fi
        
        # ✅ ENHANCED: Complete S3 bucket cleanup including versions
        if [ ! -z "$S3_BUCKET" ]; then
          echo "🪣 Emptying S3 bucket completely..."
          
          # Delete all object versions and delete markers
          echo "🗑️ Deleting all object versions..."
          aws s3api list-object-versions --bucket "$S3_BUCKET" --output json | \
          jq -r '.Versions[]? | "\(.Key) \(.VersionId)"' | \
          while read key version_id; do
            if [ ! -z "$key" ] && [ ! -z "$version_id" ]; then
              echo "   Deleting version: $key ($version_id)"
              aws s3api delete-object --bucket "$S3_BUCKET" --key "$key" --version-id "$version_id" || true
            fi
          done
          
          # Delete all delete markers
          echo "🗑️ Deleting all delete markers..."
          aws s3api list-object-versions --bucket "$S3_BUCKET" --output json | \
          jq -r '.DeleteMarkers[]? | "\(.Key) \(.VersionId)"' | \
          while read key version_id; do
            if [ ! -z "$key" ] && [ ! -z "$version_id" ]; then
              echo "   Deleting delete marker: $key ($version_id)"
              aws s3api delete-object --bucket "$S3_BUCKET" --key "$key" --version-id "$version_id" || true
            fi
          done
          
          # Final cleanup with recursive delete
          echo "🗑️ Final recursive delete..."
          aws s3 rm s3://$S3_BUCKET --recursive || true
          
          # Force empty bucket using sync
          echo "🗑️ Force emptying bucket with sync..."
          mkdir -p /tmp/empty-bucket
          aws s3 sync /tmp/empty-bucket s3://$S3_BUCKET --delete || true
          
          echo "✅ S3 bucket emptied completely"
        else
          echo "⚠️ No S3 bucket found to clean up"
        fi
        
        # Destroy infrastructure
        echo "🔨 Destroying Terraform infrastructure..."
        terraform destroy -auto-approve || true
        echo "✅ Cleanup completed!"